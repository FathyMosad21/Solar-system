name: solar system workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ secrets.DOCKER_USERNAME }} # يفضل سحبها من الـ secrets
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    strategy:
      matrix:
        nodejs_version: [18, 19, 20]
        os: [ubuntu-latest, macos-latest]
      exclude:
        - nodejs_version: 18
          os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup NodeJS version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: install dep
        run: npm install

      - name: unit testing
        continue-on-error: true
        run: npm test

      - name: archive test result
        if: always()
        uses: actions/upload-artifact@v4.0.1 # تم تعديل الـ version هنا من v7 لـ v4
        with:
          name: Mocha-Test-Result-${{ matrix.os }}-${{ matrix.nodejs_version }}
          path: test-results.xml

  code-coverage:
    name: code coverage
    needs: [unit-testing]
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup NodeJS version 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: install dep
        run: npm install

      - name: check code coverage
        continue-on-error: true
        run: npm run coverage

      - name: archive code coverage result
        uses: actions/upload-artifact@v4.0.1
        with:
          name: code-coverage-result
          path: coverage
          retention-days: 5

  docker:
    name: containerization
    needs: [code-coverage]
    permissions:
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # الأسماء الصحيحة للـ Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: fathymosad/solar-system:${{ github.sha }}

      - name: docker image test
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            fathymosad/solar-system:${{ github.sha }}
          
          sleep 5
          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"
          
          echo "Testing image url"
          curl -s http://127.0.0.1:3000/live | grep live